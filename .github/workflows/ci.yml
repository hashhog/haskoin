name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librocksdb-dev pkg-config zlib1g-dev \
            build-essential autoconf automake libtool
      - name: Build and install libsecp256k1 v0.7.1
        # Ubuntu's libsecp256k1-dev is too old: it predates the
        # ElligatorSwift module (cbits/secp256k1_compat.c needs
        # secp256k1_ellswift.h for BIP-324). Build the latest tagged
        # release with the modules haskoin links against.
        run: |
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1.git /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure --enable-module-recovery --enable-module-extrakeys \
            --enable-module-schnorrsig --enable-module-ellswift \
            --enable-module-ecdh
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Build and install minisketch
        run: |
          git clone --depth 1 https://github.com/sipa/minisketch.git /tmp/minisketch
          cd /tmp/minisketch
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Build and install rocksdb_compat shim
        run: bash scripts/build-rocksdb-compat.sh
      - run: cabal update
      - run: cabal build all

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8"
          cabal-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librocksdb-dev pkg-config zlib1g-dev \
            build-essential autoconf automake libtool
      - name: Build and install libsecp256k1 v0.7.1
        # Ubuntu's libsecp256k1-dev is too old: it predates the
        # ElligatorSwift module (cbits/secp256k1_compat.c needs
        # secp256k1_ellswift.h for BIP-324). Build the latest tagged
        # release with the modules haskoin links against.
        run: |
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1.git /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure --enable-module-recovery --enable-module-extrakeys \
            --enable-module-schnorrsig --enable-module-ellswift \
            --enable-module-ecdh
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Build and install minisketch
        run: |
          git clone --depth 1 https://github.com/sipa/minisketch.git /tmp/minisketch
          cd /tmp/minisketch
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Build and install rocksdb_compat shim
        run: bash scripts/build-rocksdb-compat.sh
      - run: cabal update
      - run: cabal test all

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: haskoin:${{ github.sha }}
