# Haskoin - Bitcoin Full Node (Haskell)
# Example configuration file
# Copy to your data directory and modify as needed.

[network]
# Network: Mainnet, Testnet, Testnet4, Regtest
network = "Mainnet"
# Script verification threads (Bitcoin Core -par). 0=auto (every core),
# 1=serial, N=N threads (N-1 extra workers), <0=leave that many cores free.
# par = 0

[storage]
# Data directory
datadir = "~/.haskoin"
# Database cache size in MB
dbcache = 450
# Enable pruning
prune = false

[rpc]
# RPC port
rpcport = 8332
# RPC authentication
rpcuser = "haskoin"
rpcpassword = "haskoin"

[p2p]
# P2P listen port
port = 8333
# Accept inbound connections
listen = true
# Bind addresses (comma-separated). Empty = all interfaces (0.0.0.0 and [::]).
# Passing bind restricts the listener (Bitcoin Core -bind).
# bind = "0.0.0.0,::"
# Maximum peer connections
maxpeers = 125

[mempool]
# (Uses Bitcoin Core defaults internally)

[logging]
# (Haskell logging via stdout)

[metrics]
# Prometheus metrics endpoint
# enabled = true
# port = 9332
